<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tasker 4 You</title>
    
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA e Iconos externos -->
    <meta name="theme-color" content="#090d16">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icon.svg">

    <!-- CSS Separado -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto select-none">

    <!-- Header dinámico -->
    <header class="py-4 flex justify-between items-center" id="header">
        <!-- Renderizado dinámicamente -->
    </header>

    <!-- Contenedor principal de Carpetas o Tareas -->
    <main class="flex-1 my-3 overflow-y-auto space-y-3 relative pb-16" id="main-content">
        <!-- Elementos se inyectan aquí -->
    </main>

    <!-- Input inferior flotante adaptativo con selector personalizado -->
    <footer class="sticky bottom-0 bg-slate-950/95 backdrop-blur-md pt-2 pb-4 space-y-2 z-40">
        
        <!-- Navbar inferior flotante para selección múltiple / acciones -->
        <div id="action-navbar" class="hidden bg-slate-900 border border-slate-700/80 p-2.5 rounded-2xl flex items-center justify-around shadow-2xl z-40">
            <button onclick="navbarRename()" class="p-2.5 text-slate-300 hover:text-indigo-400 hover:bg-slate-800 rounded-xl transition-colors text-lg cursor-pointer" title="Renombrar">✏️</button>
            <button onclick="navbarDate()" class="p-2.5 text-slate-300 hover:text-indigo-400 hover:bg-slate-800 rounded-xl transition-colors text-lg cursor-pointer" title="Fecha y hora">📅</button>
            <button onclick="navbarCopy()" class="p-2.5 text-slate-300 hover:text-indigo-400 hover:bg-slate-800 rounded-xl transition-colors text-lg cursor-pointer" title="Copiar">📋</button>
            <button onclick="navbarDelete()" class="p-2.5 text-rose-300 hover:text-white hover:bg-rose-900/60 rounded-xl transition-colors text-lg cursor-pointer" title="Eliminar">🗑️</button>
            <button onclick="exitMultiSelect()" class="p-2.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-colors text-sm font-bold cursor-pointer" title="Cerrar">✕</button>
        </div>

        <div id="selector-container" class="hidden relative">
            <div id="custom-select-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-4 py-3.5 rounded-2xl flex items-center justify-between cursor-pointer shadow-lg shadow-indigo-600/30 transition-all select-none">
                <span id="custom-select-text">📝 Tarea</span>
                <span id="custom-select-arrow" class="w-7 h-7 rounded-full bg-white/25 flex items-center justify-center text-xs font-bold">▼</span>
            </div>
            
            <div id="custom-dropdown-menu" class="hidden absolute bottom-full mb-2 left-0 w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden z-50">
                <div class="p-1.5">
                    <div id="dropdown-option-item" onclick="toggleCreationMode()" class="px-4 py-3 text-slate-200 hover:bg-slate-800 rounded-xl cursor-pointer text-sm font-medium transition-colors flex items-center gap-2">
                        📁 Subcarpeta
                    </div>
                </div>
            </div>
        </div>

        <form id="action-form" class="flex gap-2">
            <input 
                type="text" 
                id="action-input" 
                placeholder="Nombre..." 
                autocomplete="off"
                class="flex-1 bg-slate-900/90 border border-slate-800 text-sm rounded-2xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"
            >
            <button 
                type="submit" 
                class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-medium px-5 rounded-2xl text-lg transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center cursor-pointer">
                +
            </button>
        </form>
    </footer>

    <!-- Modal nativo visual para seleccionar fecha y hora -->
    <dialog id="date-modal" class="bg-slate-900 text-slate-100 border border-slate-800 p-6 rounded-3xl shadow-2xl backdrop:bg-slate-950/80 max-w-xs w-full">
        <h3 class="text-base font-bold mb-3 text-white">📅 Seleccionar fecha límite</h3>
        <input type="datetime-local" id="modal-datetime-input" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 mb-4">
        <div class="flex gap-2 justify-end">
            <button onclick="closeDateModal(false)" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors cursor-pointer">Cancelar</button>
            <button onclick="closeDateModal(true)" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition-colors cursor-pointer">Guardar</button>
        </div>
    </dialog>

    <!-- JS Separado -->
    <script src="app.js"></script>
</body>
</html>
